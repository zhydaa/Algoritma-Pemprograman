<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemrograman fungsi el 25 / javascript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</head>
<body>
    <!--membuat tampilan untuk memanggil fungsi-->
    <div class="container mt-5">
        <div class="card">
            <div class="card-body">
                <h3>Belajar Function JavaScript</h3>
                <div id="hasil" class="alert alert-info mt-3"></div>
            </div>
        </div>
    </div>
<script>
    //mendefinisikan fungsi
    function fungsi1() {
        //kode yang akan dijalankan ketika fungsi dipanggil
        document.getElementById('hasil').innerHTML += "Ini adalah fungsi 1<br>";
    }

    //memanggil fungsi
fungsi1();
fungsi1();
fungsi1();
fungsi1();
fungsi1();
</script>
</body>
</html>
