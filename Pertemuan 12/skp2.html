<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan IF 2 - Grade Zhida</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px
        }
        .card {
            max-width: 520px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, .12)
        }
        h1 {
            font-size: 24px
        }
        input,
        select {
            width: 100%;
            padding: 10px;
            margin: 7px 0 15px;
            box-sizing: border-box
        }
        button {
            padding: 11px 18px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer
        }
        button:hover {
            opacity: .9
        }
        #hasil {
            margin-top: 20px;
            padding: 12px;
            background: #eef2ff;
            font-weight: bold
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px
        }
        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left
        }
    </style>
    </style>
</head>
<body>
    <div class="card">
        <h1>Latihan 2 - Grade</h1>
        <label>Nilai:</label>
        <input type="number" id="nilai">
        <button onclick="cek()">CEK GRADE</button>
        <div id="hasil"></div>
    </div>
    <script>
        function cek() { const n = Number(document.getElementById('nilai').value);
        let g;
        if (n >= 80) {
            g = 'A';
        } else if (n >= 70) {
            g = 'B';
        } else if (n >= 60) {
            g = 'C';
        } else if (n >= 50) {
            g = 'D';
        } else {
            g = 'E';
        }
        document.getElementById('hasil').textContent = `Grade: ${g}`; }
    </script>
</body>
</html>
